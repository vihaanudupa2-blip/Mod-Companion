<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelBot — Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d12; color: #e2e2e9; line-height: 1.6;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem 2rem; text-align: center;
    }
    svg.logo { margin-bottom: 1rem; }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.4rem; }
    .accent { color: #5865f2; }
    p { color: #888; margin-bottom: 2.5rem; }
    .links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    a.card {
      display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
      background: #13131a; border: 1px solid #2a2a3a; border-radius: 16px;
      padding: 2rem 3rem; text-decoration: none; color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    a.card:hover { border-color: #5865f2; background: #16162a; }
    a.card span { font-weight: 700; font-size: 1rem; }
    a.card small { color: #666; font-size: 0.8rem; }
    footer { text-align: center; padding: 1.5rem; color: #444; font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5865f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <h1>Sentinel<span class="accent">Bot</span></h1>
    <p>Legal documents for U-bot#9111</p>
    <div class="links">
      <a class="card" href="terms.html">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5865f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Terms of Service</span>
        <small>Usage rules &amp; legal terms</small>
      </a>
      <a class="card" href="privacy.html">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5865f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Privacy Policy</span>
        <small>What data we collect &amp; why</small>
      </a>
    </div>
  </main>
  <footer>© 2026 SentinelBot. Not affiliated with Discord Inc.</footer>
</body>
</html>
