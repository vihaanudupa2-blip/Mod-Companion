kind = "web"
previewPath = "/"
title = "SentinelBot Dashboard"
description = "A focused Discord moderation dashboard for SentinelBot server owners to manage welcome and goodbye messages, AutoMod thresholds, banned words, and reaction roles in one place."
version = "1.0.0"
id = "artifacts/sentinelbot-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21143

[services.development]
run = "pnpm --filter @workspace/sentinelbot-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sentinelbot-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/sentinelbot-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21143"
BASE_PATH = "/"
